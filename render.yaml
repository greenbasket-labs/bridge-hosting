services:
  - type: web
    name: bridge-hosting
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: PROVIDER
        value: local
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false

  - type: cron
    name: bridge-reconcile
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/reconcile.mjs
    envVars:
      - key: APP_URL
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false

  - type: cron
    name: bridge-backups
    runtime: node
    plan: starter
    schedule: "17 2 * * *"
    buildCommand: npm ci
    startCommand: node scripts/collect-backups.mjs
    envVars:
      - key: APP_URL
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
